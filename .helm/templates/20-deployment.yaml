---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-exporter
  labels:
    app: github-exporter
  annotations:
    pod-reloader.deckhouse.io/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: github-exporter
  template:
    metadata:
      labels:
        app: github-exporter
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-exporter
          image: {{ index .Values.werf.image "github_exporter" }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: LISTEN_ADDRESS
              value: {{ .Values.config.listenAddress | quote }}
            - name: METRICS_PATH
              value: {{ .Values.config.metricsPath | quote }}
            - name: APP_ID
              value: {{ .Values.config.appId | quote }}
            - name: INSTALLATION_ID
              value: {{ .Values.config.installationId | quote }}
            - name: GITHUB_ORG
              value: {{ .Values.config.org | quote }}
            - name: SCRAPE_TIMEOUT
              value: {{ .Values.config.scrapeTimeout | quote }}
{{- if .Values.config.githubApiUrl }}
            - name: GITHUB_API_URL
              value: {{ .Values.config.githubApiUrl | quote }}
{{- end }}
            - name: PRIVATE_KEY
              value: {{ printf "%s/%s" .Values.privateKey.mountPath (include "github-exporter.privateKeySecretKey" .) | quote }}
          volumeMounts:
            - name: private-key
              mountPath: {{ .Values.privateKey.mountPath | quote }}
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: private-key
          secret:
            secretName: {{ include "github-exporter.privateKeySecret" . }}
            items:
              - key: {{ include "github-exporter.privateKeySecretKey" . }}
                path: {{ include "github-exporter.privateKeySecretKey" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: github-exporter
  labels:
    app: admin-api-service
    prometheus.deckhouse.io/custom-target: github-exporter
  annotations:
    prometheus.deckhouse.io/sample-limit: {{ .Values.sample_limit | quote }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: github-exporter
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: github-exporter
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: github-exporter
  updatePolicy:
    updateMode: "Off"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: github-exporter
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: github-exporter
