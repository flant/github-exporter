# Default values for the github-exporter chart.

replicaCount: 1
sample_limit: 5000

config:
  org: ""       # GITHUB_ORG
  githubApiUrl: ""     # GITHUB_API_URL (optional, for GitHub Enterprise Server)
  scrapeTimeout: "30s" # SCRAPE_TIMEOUT
  listenAddress: ":9101"
  metricsPath: "/metrics"

# GitHub App private key (PEM).
privateKey:
  # If set, a Secret is created from this value and mounted at mountPath.
  # Leave empty and set existingSecret to use a pre-created Secret instead.
  value: ""
  existingSecret: ""       # name of an existing Secret containing the key
  existingSecretKey: "private-key.pem"
  mountPath: "/etc/github-exporter"

service:
  type: ClusterIP
  port: 9101

imagePullSecrets:
  - name: registrysecret

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Deckhouse Grafana dashboard for the runners.
dashboard:
  enabled: true
  # Also deploy the dashboard as a ClusterObservabilityPropagatedDashboard
  # (observability.deckhouse.io), in addition to the GrafanaDashboardDefinition.
  observability: true

# Deckhouse Prometheus alerting rules (CustomPrometheusRules).
alerts:
  enabled: true
  runnersNotAllOnline:
    for: 5m
    severity: warning
